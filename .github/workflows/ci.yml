name: CI

on:
  push:
    branches: [ main, 'cleanup/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/promptbench_dev
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/promptbench_test
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_API_KEY: dummy-test-key
      ANTHROPIC_MODEL: gemini-2.5-flash
      ANTHROPIC_API_KEY: dummy-test-key
      JWT_SECRET_KEY: test-jwt-secret-key-must-be-long-and-random-321
      RUN_LLM_TESTS: "false"
      ENV: testing
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: promptbench_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create Development Database for Isolation
        run: |
          python -c "import psycopg2; from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT; conn = psycopg2.connect('${{ env.TEST_DATABASE_URL }}'); conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT); cur = conn.cursor(); cur.execute('CREATE DATABASE promptbench_dev;'); cur.close(); conn.close()"

      - name: Run Database Migrations and Drift Check
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/promptbench_test
        run: |
          alembic upgrade head
          alembic check

      - name: Run Backend Test Suite
        run: |
          python backend/test_flow.py

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
